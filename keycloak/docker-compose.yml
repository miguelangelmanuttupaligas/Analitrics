services:
  postgresql:
    container_name: analitrics-keycloak-postgresql
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 160m
    mem_reservation: 64m
    volumes:
      - volume-keycloak-librechat-postgresql:/var/lib/postgresql/data
    networks:
      - network-analitrics

  keycloak:
    container_name: analitrics-keycloak-keycloak
    image: quay.io/keycloak/keycloak:26.7.1
    restart: unless-stopped
    command:
      - start-dev
      - --http-port=8080
      - --https-port=8444
      - --health-enabled=true
      - --metrics-enabled=false
      - --http-relative-path=/auth
      - --hostname=${KC_HOSTNAME:-https://analitrics.com:3443/auth}
      - --hostname-admin=${KC_HOSTNAME_ADMIN:-https://analitrics.com:3443/auth}
      - --hostname-backchannel-dynamic=true
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL_HOST: postgresql
      KC_DB_URL_DATABASE: ${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/keycloak.key
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx320m"
      JAVA_OPTS_APPEND: "-XX:MaxMetaspaceSize=192m -Djava.net.preferIPv4Stack=true"
    expose:
      - "8080"
      - "9000"
    mem_limit: 640m
    mem_reservation: 256m
    volumes:
      - volume-keycloak-librechat-certs:/opt/keycloak/conf/certs:ro
      - ./themes:/opt/keycloak/themes:ro
    networks:
      network-analitrics:
        aliases:
          - keycloak

networks:
  network-analitrics:
    name: network-analitrics
    external: true

volumes:
  volume-keycloak-librechat-postgresql:
    name: volume-keycloak-librechat-postgresql
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/keycloak/postgresql
  volume-keycloak-librechat-certs:
    name: volume-keycloak-librechat-certs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/keycloak/certs
