version: 1.3.13

cache: true

fileStrategy: local

mcpSettings:
  allowedAddresses:
    - "analitrics-extension:3095"

interface:
  customWelcome: "Bienvenido {{user.name}} a Analitrics, tu asistente de chat analitico."
  endpointsMenu: false
  modelSelect: false
  parameters: false
  sidePanel: true
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: false
  multiConvo: false
  fileSearch: true
  fileCitations: true
  marketplace:
    use: false
  mcpServers:
    use: true
    create: false
    share: false
    public: false
    placeholder: "Herramientas de datos"
    trustCheckbox:
      label: "Confiar en esta conexión"
      subLabel: "Habilita herramientas conectadas a PostgreSQL para el chat actual."
  agents:
    use: false
    create: false
    share: false
    public: false

modelSpecs:
  prioritize: true
  enforce: true
  list:
    - name: "analitrics-chat"
      label: "Analitrics"
      description: "Chat analítico con contexto de archivos y datos corporativos."
      default: true
      hideBadgeRow: true
      mcpServers:
        - "analitrics-context"
        - "analitrics-postgres"
      preset:
        endpoint: "openAI"
        model: "gpt-4.1-mini"
      promptPrefix: |
          Eres Analitrics, un asistente de analítica de negocio en español.
          Para toda solicitud del usuario relacionada con datos, archivos cargados, tablas, métricas, resúmenes, hallazgos, gráficos o comparaciones, debes llamar primero a orquestar_consulta_analitica.
          Ese tool ya aplica dos capas internas:
          1. un orquestador,
          2. varios workers pequeños de contexto, intención, planificación, ejecución, validación y redacción.
          No respondas directamente ni uses otros tools como primera opción si orquestar_consulta_analitica puede resolver la solicitud.
          No improvises rutas manuales ni listas rígidas de pasos si el orquestador puede resolver la solicitud.
          Usa PostgreSQL corporativo o tools de bajo nivel solo si el orquestador no puede completar la tarea o si el usuario pide depuración técnica explícita.
          Usa los tools de bajo nivel solo si el usuario pide depuración técnica, diagnóstico o mantenimiento explícito.
          Responde siempre en español y en tono claro, ejecutivo y útil.

registration:
  socialLogins: []

endpoints:
  openAI:
    titleConvo: false

fileConfig:
  endpoints:
    openAI:
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - "text/csv"
        - "application/csv"
        - "application/vnd.ms-excel"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        - "text/plain"
        - "application/pdf"
    default:
      totalSizeLimit: 100
  serverFileSizeLimit: 100
  avatarSizeLimit: 2

mcpServers:
  analitrics-context:
    type: streamable-http
    title: "Memoria de archivo"
    description: "Memoria interna del sistema para reutilizar el archivo activo del chat como contexto analítico persistente."
    consumeOnly: true
    url: "http://analitrics-extension:3095/mcp"
    timeout: 30000
    headers:
      X-LibreChat-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-LibreChat-User-Name: "{{LIBRECHAT_USER_NAME}}"
    chatMenu: false
    startup: true
    iconURL: ""
    serverInstructions: |
      Este servidor gestiona archivos tabulares cargados por el usuario, los persiste en PostgreSQL y puede generar visualizaciones inline.
      Para solicitudes normales del usuario, usa siempre primero orquestar_consulta_analitica.
      Ese tool decide internamente cómo resolver el contexto, la intención, el plan, la ejecución y la validación.
      No dejes que el modelo responda libremente sobre archivos o datos sin pasar antes por orquestar_consulta_analitica.
      Usa los tools de bajo nivel solo si el usuario pide depuración técnica, diagnóstico o mantenimiento explícito.
      Responde siempre en español y no expliques detalles internos salvo que el usuario lo pida.
  analitrics-postgres:
    type: stdio
    title: "Datos corporativos PostgreSQL"
    description: "Consulta datos corporativos gobernados en PostgreSQL en modo solo lectura."
    command: npx
    args:
      - "-y"
      - "@yawlabs/postgres-mcp@latest"
    env:
      DATABASE_URL: "postgresql://analitrics:analitrics_local_2026@analitrics-postgres:5432/analitrics"
      POSTGRES_MAX_ROWS: "200"
      POSTGRES_STATEMENT_TIMEOUT_MS: "20000"
      POSTGRES_CONNECTION_TIMEOUT_MS: "10000"
    chatMenu: true
    startup: true
    timeout: 20000
    initTimeout: 20000
    stderr: inherit
    serverInstructions: |
      Esta conexión es de solo lectura.
      Responde en español.
      Úsala cuando ayude a complementar el análisis del chat con datos corporativos.
      Si el usuario también cargó archivos, combina ambos contextos de manera natural sin explicar detalles técnicos internos salvo que te lo pidan.
