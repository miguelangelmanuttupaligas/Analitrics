services:
  api:
    container_name: analitrics-api
    image: analitrics/librechat-custom:v0.8.7
    build:
      context: ../librechat-build-src
      dockerfile: Dockerfile
      args:
        NODE_MAX_OLD_SPACE_SIZE: 8192
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      analitrics-extension:
        condition: service_healthy
      analitrics-postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    stop_grace_period: 30s
    ports:
      - "${PORT:-3080}:3080"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
      - ./librechat.yaml:/app/librechat.yaml
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://127.0.0.1:3080\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mongodb:
    container_name: analitrics-mongodb
    image: mongo:8.0.20
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: mongod --noauth
    volumes:
      - librechat_mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  vectordb:
    container_name: analitrics-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${VECTOR_DB_NAME:-analitrics_rag}
      POSTGRES_USER: ${VECTOR_DB_USER:-analitrics_rag}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-analitrics_rag_local_2026}
    volumes:
      - librechat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  rag_api:
    container_name: analitrics-rag-api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    depends_on:
      vectordb:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - DB_HOST=vectordb
      - DB_PORT=5432
      - POSTGRES_DB=${VECTOR_DB_NAME:-analitrics_rag}
      - POSTGRES_USER=${VECTOR_DB_USER:-analitrics_rag}
      - POSTGRES_PASSWORD=${VECTOR_DB_PASSWORD:-analitrics_rag_local_2026}
      - RAG_PORT=${RAG_PORT:-8000}
    volumes:
      - librechat_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  analitrics-postgres:
    container_name: analitrics-postgres
    image: postgres:17
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${ANALITRICS_POSTGRES_DB:-analitrics}
      POSTGRES_USER: ${ANALITRICS_POSTGRES_USER:-analitrics}
      POSTGRES_PASSWORD: ${ANALITRICS_POSTGRES_PASSWORD:-analitrics_local_2026}
    ports:
      - "127.0.0.1:${ANALITRICS_POSTGRES_PORT:-5436}:5432"
    volumes:
      - analitrics_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  analitrics-extension:
    container_name: analitrics-extension
    build:
      context: ../analitrics-extension
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      analitrics-postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    stop_grace_period: 30s
    environment:
      - PORT=3095
      - POSTGRES_URL=postgresql://${ANALITRICS_POSTGRES_USER:-analitrics}:${ANALITRICS_POSTGRES_PASSWORD:-analitrics_local_2026}@analitrics-postgres:5432/${ANALITRICS_POSTGRES_DB:-analitrics}
      - MONGO_URL=mongodb://mongodb:27017/LibreChat
      - LIBRECHAT_UPLOAD_ROOT=/data/librechat-uploads
      - ALLOWED_USER_HEADER=x-librechat-user-id
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WORKER_MODEL=${WORKER_MODEL:-gpt-4.1-mini}
      - CONTEXT_MAX_ASSETS=${CONTEXT_MAX_ASSETS:-4}
      - CONTEXT_MAX_TABLES_PER_ASSET=${CONTEXT_MAX_TABLES_PER_ASSET:-3}
      - CONTEXT_MAX_COLUMNS_PER_TABLE=${CONTEXT_MAX_COLUMNS_PER_TABLE:-12}
      - CONTEXT_MAX_SAMPLE_ROWS_PER_TABLE=${CONTEXT_MAX_SAMPLE_ROWS_PER_TABLE:-3}
    volumes:
      - librechat_uploads:/data/librechat-uploads:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(\"http://127.0.0.1:3095/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  librechat_mongodb_data:
    name: analitrics_mongodb_data
  librechat_uploads:
    name: analitrics_uploads_data
  librechat_logs:
    name: analitrics_logs_data
  librechat_pgdata:
    name: analitrics_rag_pgdata
  analitrics_postgres_data:
    name: analitrics_postgres_data
