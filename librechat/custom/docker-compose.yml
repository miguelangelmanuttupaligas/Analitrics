services:
  gateway:
    container_name: analitrics-analitrics-gateway
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      admin-panel:
        condition: service_started
      upload-file-wrapper:
        condition: service_started
      analytics-agent:
        condition: service_started
    ports:
      - "${GATEWAY_HTTP_PORT:-3090}:80"
      - "${GATEWAY_HTTPS_PORT:-3443}:443"
    environment:
      PORT: ${PORT:-3080}
      ANALITRICS_DEFAULT_TENANT_ID: ${ANALITRICS_DEFAULT_TENANT_ID:-analitrics}
      PUBLIC_PORT: ${PUBLIC_PORT:-3443}
      PUBLIC_HOST: ${PUBLIC_HOST:-analitrics-test.com}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://analitrics-test.com:3443}
      GATEWAY_CONFIG_TEMPLATE: ${GATEWAY_CONFIG_TEMPLATE:-default.conf.template}
    command: >
      /bin/sh -c "template=/etc/nginx/templates/$$GATEWAY_CONFIG_TEMPLATE; test -r $$template
      && envsubst '$$PORT $$ANALITRICS_DEFAULT_TENANT_ID $$PUBLIC_PORT $$PUBLIC_HOST $$PUBLIC_ORIGIN' < $$template > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    volumes:
      - ./gateway:/etc/nginx/templates:ro
      - volume-analitrics-librechat-certs:/etc/nginx/certs:ro
    networks:
      network-analitrics:
        aliases:
          - ${PUBLIC_HOST:-analitrics-test.com}

  api:
    container_name: analitrics-analitrics-api
    build:
      context: ..
      dockerfile: custom/api/Dockerfile
    image: analitrics/librechat-api:local
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    expose:
      - "${PORT:-3080}"
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      storage-rustfs-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-3080}
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      TRUST_PROXY: 1
      SEARCH: "false"
      USE_REDIS: "false"
      USE_REDIS_STREAMS: "false"
      AWS_ENDPOINT_URL: http://storage-rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:?RUSTFS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?RUSTFS_SECRET_ACCESS_KEY is required}
      AWS_REGION: ${RUSTFS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-librechat}
      AWS_FORCE_PATH_STYLE: "true"
      ANALITRICS_AGENT_ORIGIN: http://analytics-agent:8090
      ANALITRICS_DIRECT_AGENT: "true"
      ANALITRICS_MODEL: ${ANALITRICS_MODEL:-analitrics-agent}
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      NO_PROXY: localhost,127.0.0.1,::1,mongodb,vectordb,rag_api,keycloak,gateway,postgresql,control-postgres,analytics-agent,storage-rustfs,host.docker.internal,${PUBLIC_HOST:-analitrics-test.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - volume-analitrics-librechat-uploads:/app/uploads
      - volume-analitrics-librechat-logs:/app/logs
      - volume-analitrics-librechat-skill:/app/skill
      - volume-analitrics-librechat-data:/app/data
      - volume-analitrics-librechat-images:/app/client/public/images
    networks:
      - network-analitrics

  admin-panel:
    container_name: analitrics-analitrics-admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: 3000
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      API_SERVER_URL: http://api:${PORT:-3080}
      VITE_API_BASE_URL: ${DOMAIN_CLIENT:-http://localhost:3080}
      SESSION_COOKIE_SECURE: ${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
    networks:
      - network-analitrics

  upload-file-wrapper:
    container_name: analitrics-analitrics-upload-file-wrapper
    build:
      context: ../../analitrics-adapter
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    expose:
      - "3096"
    environment:
      PORT: 3096
      LIBRECHAT_API_ORIGIN: http://api:${PORT:-3080}
      TABULAR_CONTEXT_TO_S3_ENABLED: "true"
      ANALITRICS_MAX_FILE_BYTES: ${ANALITRICS_MAX_FILE_BYTES:-26214400}
    command: node dist/uploadFileWrapperServer.js
    networks:
      - network-analitrics

  analytics-agent:
    container_name: analitrics-analitrics-analytics-agent
    build:
      context: ../../analitrics-app
    image: analitrics-app:local
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      mongodb:
        condition: service_started
      control-postgres:
        condition: service_healthy
      storage-rustfs-init:
        condition: service_completed_successfully
    expose:
      - "8090"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ANALITRICS_AGENT_PORT: 8090
      ANALITRICS_LLM_PROVIDER: ${ANALITRICS_LLM_PROVIDER:-openai}
      ANALITRICS_LOCAL_BASE_URL: ${ANALITRICS_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      ANALITRICS_LOCAL_API_KEY: ${ANALITRICS_LOCAL_API_KEY:-local-not-required}
      ANALITRICS_LOCAL_MODEL: ${ANALITRICS_LOCAL_MODEL:-qwen3:4b-instruct}
      ANALITRICS_LOCAL_USE_RESPONSE_FORMAT: ${ANALITRICS_LOCAL_USE_RESPONSE_FORMAT:-false}
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MONGO_DB: LibreChat
      ANALITRICS_POSTGRES_HOST: control-postgres
      ANALITRICS_POSTGRES_PORT: 5432
      AWS_ENDPOINT_URL: http://storage-rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ANALYTICS_ACCESS_KEY_ID:?RUSTFS_ANALYTICS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_ANALYTICS_SECRET_ACCESS_KEY:?RUSTFS_ANALYTICS_SECRET_ACCESS_KEY is required}
      AWS_REGION: ${RUSTFS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-librechat}
      ANALITRICS_CACHE_DIR: /var/analitrics/analytics/cache
      ANALITRICS_RECONCILE_INTERVAL_SECONDS: ${ANALITRICS_RECONCILE_INTERVAL_SECONDS:-21600}
      ANALITRICS_TRACING_ENABLED: ${ANALITRICS_TRACING_ENABLED:-true}
      ANALITRICS_ENGINE: ${ANALITRICS_ENGINE:-langgraph}
      ANALITRICS_CHARTS_ENABLED: ${ANALITRICS_CHARTS_ENABLED:-false}
      ANALITRICS_ALLOW_ARBITRARY_CODE: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:4317}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-analitrics-mvp}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - volume-analitrics-analytics-cache:/var/analitrics/analytics
    command: scripts/agent_http_server.py
    networks:
      - network-analitrics

  control-postgres:
    container_name: analitrics-analitrics-control-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANALITRICS_POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${ANALITRICS_POSTGRES_DB:-analitrics}
      POSTGRES_USER: ${ANALITRICS_POSTGRES_ADMIN_USER:-analitrics}
      POSTGRES_PASSWORD: ${ANALITRICS_POSTGRES_ADMIN_PASSWORD:?ANALITRICS_POSTGRES_ADMIN_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - volume-analitrics-analytics-postgresql:/var/lib/postgresql/data
    networks:
      - network-analitrics

  storage-rustfs:
    container_name: analitrics-analitrics-storage-rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    init: true
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID:?RUSTFS_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?RUSTFS_SECRET_ACCESS_KEY is required}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - volume-analitrics-librechat-storage-rustfs-data:/data
      - volume-analitrics-librechat-storage-rustfs-logs:/var/log/rustfs
    networks:
      network-analitrics:
        aliases:
          - storage-rustfs

  storage-rustfs-init:
    container_name: analitrics-analitrics-storage-rustfs-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      storage-rustfs:
        condition: service_started
    environment:
      RUSTFS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY_ID:?RUSTFS_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_ACCESS_KEY:?RUSTFS_SECRET_ACCESS_KEY is required}
      RUSTFS_BUCKET_NAME: ${RUSTFS_BUCKET_NAME:-librechat}
      RUSTFS_ANALYTICS_ACCESS_KEY_ID: ${RUSTFS_ANALYTICS_ACCESS_KEY_ID:?RUSTFS_ANALYTICS_ACCESS_KEY_ID is required}
      RUSTFS_ANALYTICS_SECRET_ACCESS_KEY: ${RUSTFS_ANALYTICS_SECRET_ACCESS_KEY:?RUSTFS_ANALYTICS_SECRET_ACCESS_KEY is required}
    entrypoint: >
      /bin/sh -c "
      export MC_HOST_rustfs=\"http://$${RUSTFS_ACCESS_KEY_ID}:$${RUSTFS_SECRET_ACCESS_KEY}@storage-rustfs:9000\";
      until timeout 10s mc admin user list rustfs >/dev/null 2>&1; do
        sleep 1;
      done;
      timeout 15s mc mb --ignore-existing rustfs/\"$${RUSTFS_BUCKET_NAME}\" || true;
      if ! mc admin user info rustfs \"$${RUSTFS_ANALYTICS_ACCESS_KEY_ID}\" >/dev/null 2>&1; then
        mc admin user add rustfs \"$${RUSTFS_ANALYTICS_ACCESS_KEY_ID}\" \"$${RUSTFS_ANALYTICS_SECRET_ACCESS_KEY}\";
      fi;
      user_info=\"$$(mc admin user info rustfs \"$${RUSTFS_ANALYTICS_ACCESS_KEY_ID}\")\";
      case \"$$user_info\" in
        *\"PolicyName: readonly\"*) ;;
        *) timeout 15s mc admin policy attach rustfs readonly --user \"$${RUSTFS_ANALYTICS_ACCESS_KEY_ID}\" || true ;;
      esac;
      user_info=\"$$(mc admin user info rustfs \"$${RUSTFS_ANALYTICS_ACCESS_KEY_ID}\")\";
      case \"$$user_info\" in
        *\"PolicyName: readonly\"*) exit 0 ;;
        *) echo \"RustFS readonly policy was not applied\"; echo \"$$user_info\"; exit 1 ;;
      esac;
      "
    networks:
      - network-analitrics

  mongodb:
    container_name: analitrics-analitrics-mongodb
    image: mongo:8.0.20
    restart: unless-stopped
    user: "${MONGO_UID:-999}:${MONGO_GID:-999}"
    command: mongod --noauth
    volumes:
      - volume-analitrics-librechat-mongodb:/data/db
    networks:
      - network-analitrics

  vectordb:
    container_name: analitrics-analitrics-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_POSTGRES_DB:-librechat}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?RAG_POSTGRES_PASSWORD is required}
    volumes:
      - volume-analitrics-librechat-vectordb:/var/lib/postgresql/data
    networks:
      - network-analitrics

  rag_api:
    container_name: analitrics-analitrics-rag-api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    depends_on:
      vectordb:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: ${RAG_POSTGRES_DB:-librechat}
      POSTGRES_USER: ${RAG_POSTGRES_USER:-librechat}
      DATABASE_USER: ${RAG_POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?RAG_POSTGRES_PASSWORD is required}
      RAG_PORT: ${RAG_PORT:-8000}
    networks:
      - network-analitrics

networks:
  network-analitrics:
    name: network-analitrics
    external: true

volumes:
  volume-analitrics-librechat-mongodb:
    name: volume-analitrics-librechat-mongodb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/mongodb
  volume-analitrics-librechat-vectordb:
    name: volume-analitrics-librechat-vectordb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/vectordb
  volume-analitrics-librechat-uploads:
    name: volume-analitrics-librechat-uploads
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/uploads
  volume-analitrics-librechat-logs:
    name: volume-analitrics-librechat-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/logs
  volume-analitrics-librechat-skill:
    name: volume-analitrics-librechat-skill
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/skill
  volume-analitrics-librechat-data:
    name: volume-analitrics-librechat-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/data
  volume-analitrics-librechat-images:
    name: volume-analitrics-librechat-images
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/images
  volume-analitrics-librechat-certs:
    name: volume-analitrics-librechat-certs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/librechat/certs
  volume-analitrics-librechat-storage-rustfs-data:
    name: volume-analitrics-librechat-storage-rustfs-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/storage/data
  volume-analitrics-librechat-storage-rustfs-logs:
    name: volume-analitrics-librechat-storage-rustfs-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/storage/logs
  volume-analitrics-analytics-cache:
    name: volume-analitrics-analytics-cache
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/analytics
  volume-analitrics-analytics-postgresql:
    name: volume-analitrics-analytics-postgresql
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/analitrics/analytics/postgresql
